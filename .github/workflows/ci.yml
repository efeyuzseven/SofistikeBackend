name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sofistike.slnx

      - name: Build
        run: dotnet build Sofistike.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Sofistike.slnx --configuration Release --no-build
